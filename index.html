<style>
/* Layout: the HLUX mark, then a pinned stage where vertical scroll, drag or arrow keys pan a
   horizontal swimlane timeline (2011 to now). Roles open into a side case file to uncover. */
:root{
  --paper:#e4e1da;      /* warm grey ground, from the timeline slide */
  --paper-2:#d8d4cb;
  --sheet:#f4f2ee;
  --ink:#15171d;
  --ink-2:#474b57;
  --ink-3:#6c6a64;
  --rule:#bdb8ad;
  --lime:#d5f53c;       /* brand chartreuse: fills only, ink text on top */
  --on-lime:#15171d;
  --logo:#15171d;
  --lens-bg:#d5f53c;
  --lens-fg:#15171d;
  --bar:#2b2e36;
  --bar-soft:#8a867d;
  --scrim:rgba(21,23,29,.42);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --px-year:300px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181d;--paper-2:#20232a;--sheet:#1d2026;--ink:#eceae4;--ink-2:#b9b6ae;--ink-3:#8f8c85;
  --rule:#3a3d45;--bar:#d9d6cf;--bar-soft:#5f6370;--scrim:rgba(0,0,0,.6);--lens-bg:#2c3118;--lens-fg:#d5f53c;--logo:#eceae4;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181d;--paper-2:#20232a;--sheet:#1d2026;--ink:#eceae4;--ink-2:#b9b6ae;--ink-3:#8f8c85;
  --rule:#3a3d45;--bar:#d9d6cf;--bar-soft:#5f6370;--scrim:rgba(0,0,0,.6);--lens-bg:#2c3118;--lens-fg:#d5f53c;--logo:#eceae4;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
::selection{background:var(--lime);color:var(--on-lime)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px;box-shadow:0 0 0 6px var(--ink)}
.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1360px;margin-inline:auto}
@media (max-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:.02em}

/* ---------- Top bar ---------- */
.topbar{position:fixed;inset:0 0 auto;z-index:20;pointer-events:none;padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:18px}
.mark{pointer-events:auto;display:inline-block;color:var(--logo);line-height:0;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.mark:hover{transform:rotate(-6deg) scale(1.06)}
.mark svg{display:block;width:44px;height:auto}

/* ---------- Pinned timeline ---------- */
.journey{position:relative;background:var(--paper-2)}
.stage{position:sticky;top:0;height:100svh;overflow:hidden;display:flex;flex-direction:column}
.stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-top:calc(92px + env(safe-area-inset-top,0px))}
.stage-head h2{font-size:clamp(26px,3vw,40px);letter-spacing:-.02em;max-width:24ch}
.stage-head p{max-width:30ch;color:var(--ink-2);font-size:15px}
.ghost-year{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:-.12em;font-family:var(--display);font-weight:800;font-size:clamp(160px,30vw,420px);line-height:1;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px var(--rule);pointer-events:none;font-variation-settings:"wdth" 75;font-variant-numeric:tabular-nums;z-index:0}
.viewport{position:relative;flex:1;min-height:0;z-index:1;cursor:grab;touch-action:pan-y}
.viewport.dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
.viewport.dragging .role,.viewport.dragging .node,.viewport.dragging .miles{cursor:grabbing}
.pan-hint{display:inline-flex;align-items:center;gap:8px;color:var(--ink-3)}
.pan-hint kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--ink-3);border-bottom-width:2px;border-radius:4px;padding:0 6px;color:var(--ink-2)}
@media (hover:none),(pointer:coarse){.pan-hint{display:none}}
.track{position:absolute;top:0;bottom:0;left:0;will-change:transform}
.lane-label{position:absolute;left:0;font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.ruler{position:absolute;left:0;right:0;bottom:56px;height:1px;background:var(--ink-3)}
.tick{position:absolute;bottom:22px;font-family:var(--mono);font-size:13px;color:var(--ink-2);transform:translateX(-50%)}
.tick::before{content:"";position:absolute;left:50%;bottom:28px;width:1px;height:10px;background:var(--ink-3)}
.tick.now{color:var(--ink);font-weight:500}
.tick.now::after{content:"";position:absolute;left:50%;bottom:30px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 1.5px var(--ink)}

.role{position:absolute;display:block;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.role .lbl{position:absolute;left:0;bottom:calc(100% + 10px);display:flex;align-items:center;gap:10px;padding:5px 12px 5px 10px;border-left:2px solid var(--ink);border-radius:0 12px 12px 0;white-space:nowrap;transform-origin:0 100%;background:transparent;transition:transform .45s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .3s}
.role .av{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:-.02em;font-variation-settings:"wdth" 85;transition:background .25s,color .25s}
.role.current .av,.role:hover .av,.role:focus-visible .av{background:var(--lime);color:var(--on-lime);box-shadow:0 0 0 1.5px var(--ink)}
.role.thin .av{width:28px;height:28px;font-size:11px}
.role:hover,.role:focus-visible{z-index:6}
.role .lbl strong{display:block;font-family:var(--display);font-size:22px;line-height:1.05;letter-spacing:-.01em;font-variation-settings:"wdth" 88}
.role .lbl small{display:block;font-size:14px;color:var(--ink-2);margin-top:3px}
.role .pill{display:block;height:100%;border-radius:999px;background:var(--bar);position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.role .pill::after{content:"";position:absolute;inset:0;background:var(--lime);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.6,0,.2,1)}
.role .peek{position:absolute;left:0;top:calc(100% + 12px);font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .3s}
.role .peek em{font-style:normal;background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:999px;margin-left:8px}
.role:hover .pill::after,.role:focus-visible .pill::after{transform:scaleX(1)}
.role:hover .lbl,.role:focus-visible .lbl{transform:translateY(-6px)}
@media (prefers-reduced-motion:reduce){.role .lbl{transition:none}}
.role:hover .peek,.role:focus-visible .peek{opacity:1;transform:none}
.role.current .pill{background:var(--lime);box-shadow:inset 0 0 0 2px var(--ink)}
.role.current .pill::after{background:var(--ink);opacity:.15}
.role.thin .lbl strong{font-size:18px}
.role.found .pill::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--lime) 60%,transparent) 6px 9px);z-index:1}

.node{position:absolute;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:none;border:0;padding:0;cursor:pointer;z-index:2}
.node::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--paper-2);border:2px solid var(--ink);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .2s}
.node:hover::before,.node:focus-visible::before{transform:scale(2);background:var(--lime)}
.node .tip{bottom:calc(100% + 22px)}
@media (prefers-reduced-motion:reduce){.node::before{transition:none}}
.miles{position:absolute;width:16px;height:16px;margin-left:-8px;background:none;border:0;padding:0;cursor:help}
.miles::before{content:"";position:absolute;inset:1px;background:var(--ink);transform:rotate(45deg);transition:background .2s}
.miles:hover::before,.miles:focus-visible::before{background:var(--lime);box-shadow:0 0 0 1.5px var(--ink)}
.miles:hover,.miles:focus-visible,.node:hover,.node:focus-visible{z-index:5}
.tip{position:absolute;left:50%;bottom:calc(100% + 14px);transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--paper);font-size:13px;line-height:1.35;padding:8px 11px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;font-family:var(--body)}
.tip i{display:block;font-style:normal;font-family:var(--mono);font-size:11px;opacity:.75;margin-top:2px}
.node:hover .tip,.node:focus-visible .tip{opacity:1;transform:translateX(-50%)}
.miles:hover .tip,.miles:focus-visible .tip{opacity:1;transform:translateX(-50%)}

.stage-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.progress{flex:1;max-width:420px;height:3px;background:var(--rule);border-radius:3px;overflow:hidden}
.progress span{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:9px;background:var(--bar)}
.legend i.d{width:9px;height:9px;border-radius:0;transform:rotate(45deg)}
.legend i.n{width:10px;height:10px;border-radius:50%;background:transparent;border:2px solid var(--ink)}
@media (max-width:700px){.legend{display:none}.stage-head p{display:none}}

/* ---------- Case file drawer ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.file{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);z-index:41;background:var(--sheet);color:var(--ink);overflow-y:auto;overscroll-behavior:contain;
  transform:translateX(102%);transition:transform .55s cubic-bezier(.7,0,.15,1);
  padding:calc(28px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) 40px;
  box-shadow:-30px 0 60px -30px rgba(0,0,0,.35)}
.file.on{transform:none}
@media (max-width:600px){.file{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}}
.file-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .2s,transform .3s}
.x:hover{background:var(--lime);color:var(--on-lime);transform:rotate(90deg)}
.f-dates{display:inline-block;background:var(--lime);color:var(--on-lime);padding:4px 11px;border-radius:999px}
.f-title{font-size:clamp(34px,5vw,54px);line-height:.98;letter-spacing:-.03em;margin-top:34px;font-variation-settings:"wdth" 85;font-weight:800}
.f-org{font-size:19px;color:var(--ink-2);margin-top:10px}
.f-lede{margin-top:22px;font-size:17px;max-width:48ch}

.vault{margin-top:36px;border:1.5px solid var(--ink);border-radius:14px;padding:22px;position:relative;overflow:hidden}
.vault .mono{color:var(--ink-3)}
.vault-num{font-family:var(--display);font-weight:800;font-size:clamp(52px,9vw,92px);line-height:.95;letter-spacing:-.04em;margin-top:12px;font-variation-settings:"wdth" 80;filter:blur(14px);opacity:.35;user-select:none;transition:filter .5s,opacity .5s}
.vault-cap{margin-top:10px;max-width:44ch;filter:blur(6px);opacity:.4;transition:filter .5s .1s,opacity .5s .1s}
.vault.open .vault-num,.vault.open .vault-cap{filter:none;opacity:1;user-select:auto}
.hold{margin-top:18px;position:relative;overflow:hidden;width:100%;min-height:52px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:500;touch-action:none;-webkit-user-select:none;user-select:none}
.hold .fill{position:absolute;inset:0;background:var(--lime);transform:scaleX(0);transform-origin:left;transition:transform .15s}
.hold.holding .fill{transform:scaleX(1);transition:transform .9s linear}
.hold .t{position:relative}
.vault.open .hold{display:none}

.probe-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:40px;gap:12px}
.probe-head h3{font-size:22px;letter-spacing:-.01em}
.count{color:var(--ink-3);font-variant-numeric:tabular-nums}
.probes{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:0}
.probe{border-top:1px solid var(--rule)}
.probe:last-child{border-bottom:1px solid var(--rule)}
.probe button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:6px 16px;width:100%;padding:18px 4px;cursor:pointer}
.probe button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.probe .q{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em;font-variation-settings:"wdth" 92}
.probe .plus{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;transition:transform .35s,background .2s;align-self:start}
.probe .a{grid-column:1/-1;color:var(--ink-2);max-width:52ch;filter:blur(7px);opacity:.45;max-height:2.9em;overflow:hidden;transition:filter .35s,opacity .35s,max-height .5s}
.probe button:hover .a{filter:blur(3.5px);opacity:.7}
.probe.open .a{filter:none;opacity:1;max-height:14em;color:var(--ink)}
.probe.open .plus{transform:rotate(45deg);background:var(--lime);color:var(--on-lime)}
.done-msg{margin-top:22px;color:var(--ink-3);min-height:1.5em}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>

const ghost = document.getElementById('ghost');
const prog = document.getElementById('prog');
function travel(){ return Math.max(0, track.offsetWidth - window.innerWidth); }
function sizeSection(){ journey.style.height = (travel() + window.innerHeight) + 'px'; }
let ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    ticking=false;
    const top = journey.getBoundingClientRect().top;
    const span = journey.offsetHeight - window.innerHeight;
    const p = span>0 ? Math.min(1, Math.max(0, -top/span)) : 0;
    const tx = p * travel();
    track.style.transform = `translate3d(${-tx}px,0,0)`;
    prog.style.transform = `scaleX(${p})`;
    const centerT = START + ((tx + window.innerWidth*0.5) - PAD)/PX;
    const yr = Math.max(START, Math.min(2026, Math.floor(centerT)));
    if(ghost.textContent != yr) ghost.textContent = yr;
  });
}
window.addEventListener('scroll', onScroll, {passive:true});
let rz; window.addEventListener('resize', ()=>{clearTimeout(rz); rz=setTimeout(layout,120);});

// ---------- Case file ----------
const file = document.getElementById('file'), scrim = document.getElementById('scrim');
const vault = document.getElementById('vault'), hold = document.getElementById('hold');
const probesEl = document.getElementById('probes'), countEl = document.getElementById('count'), doneMsg = document.getElementById('doneMsg');
let lastFocus=null, opened=0, total=0;
function updateCount(){ countEl.textContent = `${opened} of ${total} uncovered`; doneMsg.textContent = opened===total && total ? 'You found everything in this file. Ask me about it in person.' : ''; }
function openFile(r, from, focusClient){
  lastFocus = from;
  document.getElementById('fDates').textContent = r.dates;
  document.getElementById('fTitle').textContent = r.role;
  document.getElementById('fOrg').textContent = r.org;
  document.getElementById('fLede').textContent = r.lede;
  vault.classList.remove('open'); hold.classList.remove('holding');
  if(r.metric){ vault.hidden=false; document.getElementById('vNum').textContent=r.metric.v; document.getElementById('vCap').textContent=r.metric.c; }
  else vault.hidden=true;
  document.getElementById('pHead').textContent = r.id==='contract' ? 'Pick a client' : 'Ask about it';
  probesEl.innerHTML=''; opened=0; total=r.probes.length;
  r.probes.forEach((p,i)=>{
    const li=document.createElement('li'); li.className='probe';
    li.innerHTML=`<button type="button" aria-expanded="false"><span class="q"></span><span class="plus" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="a"></span></button>`;
    li.querySelector('.q').textContent=p[0]; li.querySelector('.a').textContent=p[1];
    const btn=li.querySelector('button');
    btn.addEventListener('click',()=>{
      const on=!li.classList.contains('open');
      li.classList.toggle('open',on); btn.setAttribute('aria-expanded',on);
      opened += on?1:-1; updateCount();
    });
    if(focusClient && p[0].startsWith(focusClient)){ li.classList.add('open'); btn.setAttribute('aria-expanded','true'); opened++; }
    probesEl.appendChild(li);
  });
  updateCount();
  scrim.hidden=false; file.hidden=false;
  requestAnimationFrame(()=>{ scrim.classList.add('on'); file.classList.add('on'); });
  file.scrollTop=0;
  document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('fClose').focus({preventScroll:true}), 60);
}
function closeFile(){
  scrim.classList.remove('on'); file.classList.remove('on');
  document.body.style.overflow='';
  setTimeout(()=>{ scrim.hidden=true; file.hidden=true; }, 520);
  if(lastFocus) lastFocus.focus({preventScroll:true});
}
document.getElementById('fClose').addEventListener('click', closeFile);
scrim.addEventListener('click', closeFile);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !file.hidden) closeFile();
  if(e.key==='Tab' && !file.hidden){
    const f=[...file.querySelectorAll('button:not([hidden])')].filter(b=>b.offsetParent!==null);
    if(!f.length) return;
    if(e.shiftKey && document.activeElement===f[0]){e.preventDefault(); f[f.length-1].focus();}
    else if(!e.shiftKey && document.activeElement===f[f.length-1]){e.preventDefault(); f[0].focus();}
  }
});

// press and hold
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fillEl = hold.querySelector('.fill');
function startHold(){ if(reduce){ vault.classList.add('open'); return; } hold.classList.add('holding'); }
function stopHold(){ if(!vault.classList.contains('open')) hold.classList.remove('holding'); }
fillEl.addEventListener('transitionend', e=>{ if(hold.classList.contains('holding') && e.propertyName==='transform'){ vault.classList.add('open'); document.getElementById('fClose').focus({preventScroll:true}); } });
hold.addEventListener('pointerdown', e=>{ e.preventDefault(); startHold(); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>hold.addEventListener(ev, stopHold));
hold.addEventListener('keydown', e=>{ if((e.key===' '||e.key==='Enter') && !e.repeat){ e.preventDefault(); startHold(); } });
hold.addEventListener('keyup', e=>{ if(e.key===' '||e.key==='Enter') stopHold(); });
hold.addEventListener('contextmenu', e=>e.preventDefault());


// ---------- Drag to pan + arrow keys ----------
// Horizontal position is a function of page scroll, so panning just moves the scroll position.
const scrollTo_ = (top, smooth)=> window.scrollTo({top, behavior: (smooth && !reduce) ? 'smooth' : 'instant'});
const stageTop = ()=> journey.getBoundingClientRect().top + window.scrollY;
const clampY = y => Math.min(stageTop() + travel(), Math.max(stageTop(), y));
let drag=null, suppressClick=false;
viewport.addEventListener('pointerdown', e=>{
  if(e.pointerType!=='mouse' || e.button!==0) return;
  drag={x:e.clientX, y0:window.scrollY, moved:false, id:e.pointerId};
});
window.addEventListener('pointermove', e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const dx = e.clientX - drag.x;
  if(!drag.moved && Math.abs(dx) > 5){ drag.moved=true; viewport.classList.add('dragging'); try{viewport.setPointerCapture(e.pointerId);}catch(_){} }
  if(drag.moved){ e.preventDefault(); scrollTo_(clampY(drag.y0 - dx), false); }
});
const endDrag = ()=>{ if(!drag) return; if(drag.moved){ suppressClick=true; setTimeout(()=>suppressClick=false,0); } viewport.classList.remove('dragging'); drag=null; };
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
viewport.addEventListener('click', e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick=false; } }, true);
viewport.addEventListener('dragstart', e=>e.preventDefault());
// trackpad sideways swipe
viewport.addEventListener('wheel', e=>{
  if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){ e.preventDefault(); scrollTo_(clampY(window.scrollY + e.deltaX), false); }
}, {passive:false});
document.addEventListener('keydown', e=>{
  if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
  if(!file.hidden || e.altKey || e.metaKey || e.ctrlKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  const r = journey.getBoundingClientRect();
  const inView = r.top < window.innerHeight*0.6 && r.bottom > window.innerHeight*0.4;
  if(!inView) return;
  e.preventDefault();
  const step = (e.shiftKey ? 3 : 1) * PX;
  scrollTo_(clampY(window.scrollY + (e.key==='ArrowRight' ? step : -step)), true);
});



if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
layout();
})();
</script>

</body></html>
